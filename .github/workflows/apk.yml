name: Build debug APK (S14-1 app)
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install and test
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Add Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Apply SmartSetu icon and splash
        run: |
          test -d resources/android/res
          cp -R resources/android/res/. android/app/src/main/res/
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          test -f android/app/src/main/res/drawable-port-xxhdpi/splash.png
      - name: Raise Gradle wrapper download timeout
        run: |
          sed -i 's/^networkTimeout=10000$/networkTimeout=120000/' android/gradle/wrapper/gradle-wrapper.properties
          grep -x 'networkTimeout=120000' android/gradle/wrapper/gradle-wrapper.properties
      - name: Build debug APK
        working-directory: android
        run: |
          for i in 1 2 3; do
            ./gradlew assembleDebug --no-daemon && exit 0
            echo "Gradle attempt $i failed, retrying in 20 s"
            sleep 20
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: smartsetu-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
