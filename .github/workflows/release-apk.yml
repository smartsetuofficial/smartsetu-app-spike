name: Build signed release APK (S14-3)
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KS_B64: ${{ secrets.SMARTSETU_KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.SMARTSETU_KEYSTORE_PASS }}
      EXPECTED_CERT_SHA256: 'ce6eaa8af68d7f5a067ec17c9404479a4548bda699f52e989636dbf716a74c86'
    steps:
      - name: Check signing secrets exist
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "Signing secrets missing. Add SMARTSETU_KEYSTORE_B64 and SMARTSETU_KEYSTORE_PASS in the repo: Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install and test
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Add Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Raise Gradle wrapper download timeout
        run: |
          sed -i 's/^networkTimeout=10000$/networkTimeout=120000/' android/gradle/wrapper/gradle-wrapper.properties
          grep -x 'networkTimeout=120000' android/gradle/wrapper/gradle-wrapper.properties
      - name: Set app version from package.json
        run: |
          cat > "$RUNNER_TEMP/ver.js" <<'EOF'
          const fs = require('fs');
          const v = require(process.cwd() + '/package.json').version, p = v.split('.').map(Number);
          const code = p[0] * 10000 + p[1] * 100 + p[2];
          const f = ['android/app/build.gradle', 'android/app/build.gradle.kts'].find(function (x) { return fs.existsSync(x); });
          if (!f) { console.log('WARNING: no android/app/build.gradle, version not set'); process.exit(0); }
          let s = fs.readFileSync(f, 'utf8');
          s = s.replace(/(versionCode\s*=?\s*)\d+/, function (m, a) { return a + code; });
          s = s.replace(/(versionName\s*=?\s*)"[^"]*"/, function (m, a) { return a + '"' + v + '"'; });
          fs.writeFileSync(f, s);
          console.log('version set: code ' + code + ', name ' + v + ' in ' + f);
          EOF
          node "$RUNNER_TEMP/ver.js"
          grep -n 'versionCode\|versionName' android/app/build.gradle* || true
      - name: Build release APK (unsigned)
        working-directory: android
        run: |
          for i in 1 2 3; do
            ./gradlew assembleRelease --no-daemon && exit 0
            echo "Gradle attempt $i failed, retrying in 20 s"
            sleep 20
          done
          exit 1
      - name: Align and sign
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT=$(ls -d "$SDK"/build-tools/*/ | sort -V | tail -1)
          echo "build-tools: $BT"
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "unsigned apk: $UNSIGNED"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.pfx"
          "$BT/zipalign" -P 16 -f -v 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/zipalign" -c -P 16 -v 4 "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.pfx" --ks-type PKCS12 --ks-pass env:KS_PASS --out smartsetu-release.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs smartsetu-release.apk | tee "$RUNNER_TEMP/verify.txt"
          tr 'A-Z' 'a-z' < "$RUNNER_TEMP/verify.txt" | grep -q "$EXPECTED_CERT_SHA256" || { echo "Signing certificate is not the expected one. Build stopped."; exit 1; }
          "$BT/aapt2" dump badging smartsetu-release.apk | tee "$RUNNER_TEMP/badging.txt" | head -3
          grep -q "package: name='in.smartsetu.app'" "$RUNNER_TEMP/badging.txt" || { echo "Wrong package name. Build stopped."; exit 1; }
      - name: Remove key file
        if: always()
        run: rm -f "$RUNNER_TEMP/release.pfx"
      - uses: actions/upload-artifact@v4
        with:
          name: smartsetu-release-apk
          path: smartsetu-release.apk
          retention-days: 14
